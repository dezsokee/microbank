name: CI — API Gateway

on:
  push:
    branches: [main]
    paths: [services/api-gateway/**, .github/workflows/reusable-go.yml, .github/workflows/ci-api-gateway.yml]
  pull_request:
    paths: [services/api-gateway/**, .github/workflows/reusable-go.yml, .github/workflows/ci-api-gateway.yml]
  workflow_dispatch:
    inputs:
      cosign_enabled:
        description: 'Enable Cosign signing and verification'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-go.yml
    with:
      service_name: api-gateway
      service_path: services/api-gateway
      cosign_enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.cosign_enabled }}
