name: Benchmark — Cosign Signing Overhead

on:
  schedule:
    # 22:00 CEST (20:00 UTC) — fut éjjel, laptop nem kell
    - cron: '0 20 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVICE_PATH: services/api-gateway
  ITERATIONS: 5

jobs:
  with-cosign:
    name: "Benchmark: WITH Cosign (5x)"
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run 5 iterations WITH Cosign
        run: |
          IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/microbank-api-gateway"
          DATA_FILE="/tmp/results_with.tsv"

          for i in $(seq 1 ${{ env.ITERATIONS }}); do
            echo "=== Iteration $i / ${{ env.ITERATIONS }} (WITH Cosign) ==="

            T0=$(date +%s%3N)
            docker buildx build \
              --push \
              --no-cache \
              --tag "$IMG:bench-with-${{ github.run_id }}-$i" \
              --metadata-file /tmp/meta.json \
              ${{ env.SERVICE_PATH }}
            T1=$(date +%s%3N)

            DIGEST=$(jq -r '."containerimage.digest"' /tmp/meta.json)

            cosign sign --yes "$IMG@$DIGEST"
            T2=$(date +%s%3N)

            cosign verify \
              --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "$IMG@$DIGEST"
            T3=$(date +%s%3N)

            BUILD_MS=$((T1 - T0))
            SIGN_MS=$((T2 - T1))
            VERIFY_MS=$((T3 - T2))
            TOTAL_MS=$((T3 - T0))

            echo "$i\t$BUILD_MS\t$SIGN_MS\t$VERIFY_MS\t$TOTAL_MS" >> "$DATA_FILE"
            echo "  build=${BUILD_MS}ms  sign=${SIGN_MS}ms  verify=${VERIFY_MS}ms  total=${TOTAL_MS}ms"
          done

          echo "## Cosign BE — Build + Sign + Verify (5 iteráció)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Build (ms) | Sign (ms) | Verify (ms) | Összesen (ms) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|-----------|-----------|-------------|---------------|" >> "$GITHUB_STEP_SUMMARY"

          SUM_BUILD=0; SUM_SIGN=0; SUM_VERIFY=0; SUM_TOTAL=0
          while IFS=$'\t' read -r idx build sign verify total; do
            echo "| $idx | $build | $sign | $verify | $total |" >> "$GITHUB_STEP_SUMMARY"
            SUM_BUILD=$((SUM_BUILD + build))
            SUM_SIGN=$((SUM_SIGN + sign))
            SUM_VERIFY=$((SUM_VERIFY + verify))
            SUM_TOTAL=$((SUM_TOTAL + total))
          done < "$DATA_FILE"

          N=${{ env.ITERATIONS }}
          echo "| **Átlag** | **$((SUM_BUILD/N))** | **$((SUM_SIGN/N))** | **$((SUM_VERIFY/N))** | **$((SUM_TOTAL/N))** |" >> "$GITHUB_STEP_SUMMARY"

  without-cosign:
    name: "Benchmark: WITHOUT Cosign (5x)"
    runs-on: ubuntu-latest
    needs: with-cosign
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run 5 iterations WITHOUT Cosign
        run: |
          IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/microbank-api-gateway"
          DATA_FILE="/tmp/results_without.tsv"

          for i in $(seq 1 ${{ env.ITERATIONS }}); do
            echo "=== Iteration $i / ${{ env.ITERATIONS }} (WITHOUT Cosign) ==="

            T0=$(date +%s%3N)
            docker buildx build \
              --push \
              --no-cache \
              --tag "$IMG:bench-without-${{ github.run_id }}-$i" \
              ${{ env.SERVICE_PATH }}
            T1=$(date +%s%3N)

            BUILD_MS=$((T1 - T0))
            TOTAL_MS=$BUILD_MS

            echo "$i\t$BUILD_MS\t$TOTAL_MS" >> "$DATA_FILE"
            echo "  build=${BUILD_MS}ms  total=${TOTAL_MS}ms"
          done

          echo "## Cosign NÉLKÜL — Build only (5 iteráció)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Build (ms) | Sign (ms) | Verify (ms) | Összesen (ms) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|-----------|-----------|-------------|---------------|" >> "$GITHUB_STEP_SUMMARY"

          SUM_BUILD=0; SUM_TOTAL=0
          while IFS=$'\t' read -r idx build total; do
            echo "| $idx | $build | — | — | $total |" >> "$GITHUB_STEP_SUMMARY"
            SUM_BUILD=$((SUM_BUILD + build))
            SUM_TOTAL=$((SUM_TOTAL + total))
          done < "$DATA_FILE"

          N=${{ env.ITERATIONS }}
          echo "| **Átlag** | **$((SUM_BUILD/N))** | **—** | **—** | **$((SUM_TOTAL/N))** |" >> "$GITHUB_STEP_SUMMARY"
