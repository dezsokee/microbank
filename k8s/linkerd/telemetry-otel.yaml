# Linkerd equivalent of k8s/istio/telemetry-otel.yaml.
#
# Linkerd does NOT have an analogue of Istio's Telemetry CRD. There is no
# Kubernetes object to apply here. Proxy-level tracing is configured at
# Linkerd-install time by passing flags to `linkerd install`.
#
# For the dissertation benchmark, application-level OTel is already wired up:
# every MicroBank service exports traces via OTEL_EXPORTER_OTLP_ENDPOINT to
# the OTel collector. This is mesh-agnostic and works under both Istio and
# Linkerd, so no extra configuration is required for trace coverage.
#
# If you ALSO want proxy-level tracing (matching the Istio Telemetry CRD's
# 100% sampling of proxy spans), reinstall Linkerd with proxy tracing:
#
#   linkerd install \
#     --set proxy.tracing.collector.address=otel-otel-collector.student-research:4317 \
#     --set proxy.tracing.collector.service=otel-otel-collector \
#     | kubectl apply -f -
#
# Note: this is an install-time setting, not a runtime CRD. It costs another
# fixed ~5–10% CPU per proxy, which will skew the latency benchmark — leave
# it OFF for the apples-to-apples Istio-vs-Linkerd comparison.
