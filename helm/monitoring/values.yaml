namespace: student-research
microbankReleaseName: microbank

serviceMesh:
  # Active mesh in the cluster. Prometheus + Grafana opt out of injection
  # under either mesh so the metrics path has no sidecar overhead.
  # One of: istio | linkerd | none.
  provider: istio

prometheus:
  image: prom/prometheus:v2.51.0
  replicas: 1
  storage:
    size: 2Gi
    storageClass: ""
  retention: 15d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  image: grafana/grafana:10.4.1
  replicas: 1
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  grafanaHost: grafana.mk.local
  prometheusHost: prometheus.mk.local
  # TLS a grafana/prometheus hostokra. Ha nincs kezzel megadott secret, a Helm
  # generel egy self-signed tanusitvanyt (a bongeszo egyszeri figyelmeztetese
  # utan elfogadhato). Lokalis minikube-hoz eleg; production-ben csereld le
  # cert-manager / valos tanusitvanyra.
  tls:
    enabled: true
    secretName: monitoring-tls

# Kyverno admission-controller metrics scrape.
# Exposes kyverno_admission_review_duration_seconds, kyverno_admission_requests_total,
# kyverno_policy_execution_duration_seconds, kyverno_policy_results, ... on port 8000.
kyverno:
  enabled: true
  namespace: kyverno
  # Admission-controller metrics Service. Verify with:
  #   kubectl -n kyverno get svc | grep metrics
  # (older installs: kyverno-svc-metrics; split-controller installs may differ)
  metricsService: kyverno-svc-metrics
  metricsPort: 8000

# kube-apiserver /metrics scrape — provides the "outside" view of webhook latency
# (apiserver_admission_webhook_admission_duration_seconds). Requires the ClusterRole
# in prometheus-rbac.yaml and the ServiceAccount token mounted into the Prometheus pod.
apiServer:
  scrape: true
