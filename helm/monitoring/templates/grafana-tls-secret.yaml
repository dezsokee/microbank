{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
{{- $name := .Values.ingress.tls.secretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
type: kubernetes.io/tls
{{- if $existing }}
# Meglevo tanusitvany ujrahasznalasa -> nem valtozik minden helm upgrade-nel.
data:
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $altNames := list .Values.ingress.grafanaHost .Values.ingress.prometheusHost }}
{{- $cert := genSelfSignedCert .Values.ingress.grafanaHost nil $altNames 3650 }}
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
