apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-prometheus-config
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Go services
      - job_name: "api-gateway"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-api-gateway:8080"]
            labels:
              service: api-gateway

      - job_name: "auth-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-auth-service:8081"]
            labels:
              service: auth-service

      - job_name: "fraud-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-fraud-service:8084"]
            labels:
              service: fraud-service

      # Spring Boot services (Kotlin/Java)
      - job_name: "account-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-account-service:8082"]
            labels:
              service: account-service

      - job_name: "transaction-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-transaction-service:8083"]
            labels:
              service: transaction-service

      - job_name: "audit-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-audit-service:8087"]
            labels:
              service: audit-service

      # Python services
      - job_name: "exchange-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-exchange-service:8085"]
            labels:
              service: exchange-service

      - job_name: "notification-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-notification-service:8086"]
            labels:
              service: notification-service
{{- if .Values.kyverno.enabled }}

      # Kyverno admission controller — supply-chain / admission-latency measurement
      - job_name: "kyverno"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.kyverno.metricsService }}.{{ .Values.kyverno.namespace }}.svc.cluster.local:{{ .Values.kyverno.metricsPort }}"]
            labels:
              service: kyverno
{{- end }}
{{- if .Values.apiServer.scrape }}

      # kube-apiserver — "outside" view of admission webhook latency
      # (apiserver_admission_webhook_admission_duration_seconds). Needs the
      # ClusterRole in prometheus-rbac.yaml + mounted ServiceAccount token.
      - job_name: "kube-apiserver"
        scheme: https
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
{{- end }}
