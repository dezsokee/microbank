apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-prometheus-config
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # Go services
      - job_name: "api-gateway"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-api-gateway:8080"]
            labels:
              service: api-gateway

      - job_name: "auth-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-auth-service:8081"]
            labels:
              service: auth-service

      - job_name: "fraud-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-fraud-service:8084"]
            labels:
              service: fraud-service

      # Spring Boot services (Kotlin/Java)
      - job_name: "account-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-account-service:8082"]
            labels:
              service: account-service

      - job_name: "transaction-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-transaction-service:8083"]
            labels:
              service: transaction-service

      - job_name: "audit-service"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-audit-service:8087"]
            labels:
              service: audit-service

      # Python services
      - job_name: "exchange-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-exchange-service:8085"]
            labels:
              service: exchange-service

      - job_name: "notification-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ .Values.microbankReleaseName }}-notification-service:8086"]
            labels:
              service: notification-service

      # Mesh-level (Envoy sidecar) request metrics — istio_request_duration_milliseconds
      # etc. Reported per hop (source_workload -> destination_workload), tagged with
      # connection_security_policy (mutual_tls | none). This is separate from the
      # app-level jobs above: those measure in-process handler time, this measures
      # what the proxy actually saw on the wire, so it's what shows mTLS overhead.
      - job_name: "istio-proxy"
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Values.namespace }}
        relabel_configs:
          # role:pod emits one target per declared container port; keep only the
          # istio-proxy's dedicated stats port so app pods without a sidecar
          # (e.g. postgres) and app-level ports on meshed pods are dropped.
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http-envoy-prom
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Per-container CPU + memory from the kubelet's resource metrics endpoint
      # (/metrics/resource): same data as the Summary API that benchmark/sampler.py
      # reads — cumulative CPU seconds and working set for every container,
      # app and istio-proxy/linkerd-proxy separately. cAdvisor is not an option
      # here: under the minikube docker driver it only exposes pod-level cgroups.
      # Scraped through the apiserver node proxy, so no direct kubelet access needed.
      - job_name: "kubelet-resource"
        scrape_interval: 10s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/resource
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          # service = deployment name without the release prefix,
          # e.g. microbank-account-service-597569744-7cmk5 -> account-service
          - source_labels: [pod]
            regex: "(?:{{ .Values.microbankReleaseName }}-|{{ include "monitoring.fullname" . }}-)?(.+)-[a-z0-9]{6,10}-[a-z0-9]{5}"
            target_label: service
          # kind = sidecar (mesh proxy) | app (everything else)
          - source_labels: [container]
            regex: ".+"
            target_label: kind
            replacement: app
          - source_labels: [container]
            regex: "istio-proxy|linkerd-proxy"
            target_label: kind
            replacement: sidecar
