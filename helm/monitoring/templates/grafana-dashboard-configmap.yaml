apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-grafana-dashboards
  labels:
    app: grafana
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  microbank-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Service Health Overview",
          "type": "stat",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "count(up{job!=\"prometheus\"} == 1)",
              "legendFormat": "Healthy"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "green", "value": 8 }
                ]
              },
              "unit": "none",
              "displayName": "Services Up"
            }
          }
        },
        {
          "title": "Request Rate by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{job!=\"prometheus\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{job!=\"prometheus\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Error Rate by Service (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{job!=\"prometheus\", status=~\"5..\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{job!=\"prometheus\", status=~\"5..\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "title": "P50 Latency by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (service, le) (rate(http_request_duration_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (service, le) (rate(http_server_requests_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (service, le) (rate(http_requests_duration_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P99 Latency by Service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_request_duration_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_server_requests_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_requests_duration_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "CPU Usage by Pod (cores, app + sidecar)",
          "type": "timeseries",
          "description": "kubelet /metrics/resource (Summary API data): all containers of the pod, sidecar included. Per-container split: Container Resources (kubelet) dashboard.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            {
              "expr": "sum by (service) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Values.namespace }}\"}[1m]))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Memory Usage by Pod (working set, app + sidecar)",
          "type": "timeseries",
          "description": "kubelet /metrics/resource (Summary API data): all containers of the pod, sidecar included. Per-container split: Container Resources (kubelet) dashboard.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [
            {
              "expr": "sum by (service) (container_memory_working_set_bytes{namespace=\"{{ .Values.namespace }}\"})",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Request Rate per Endpoint (API Gateway)",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "targets": [
            {
              "expr": "sum by (method, path) (rate(http_requests_total{service=~\".*api-gateway.*\"}[5m]))",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "title": "Avg Response Time by Service",
          "type": "timeseries",
          "description": "Average request duration per service. Shifts upward when mTLS handshake cost is amortized into per-request latency.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_request_duration_seconds_sum{job!=\"prometheus\"}[5m])) / sum by (service) (rate(http_request_duration_seconds_count{job!=\"prometheus\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_sum{job!=\"prometheus\"}[5m])) / sum by (service) (rate(http_server_requests_seconds_count{job!=\"prometheus\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "sum by (service) (rate(http_requests_duration_seconds_sum{job!=\"prometheus\"}[5m])) / sum by (service) (rate(http_requests_duration_seconds_count{job!=\"prometheus\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P95 Latency by Service",
          "type": "timeseries",
          "description": "95th percentile latency. mTLS typically shifts P95 before P99 (which is GC-dominated).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_server_requests_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_requests_duration_seconds_bucket{job!=\"prometheus\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Latency Distribution Heatmap — API Gateway",
          "type": "heatmap",
          "description": "Full latency distribution over time. Under mTLS a second band appears (new handshake vs reused connection) — invisible on percentile charts.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 44 },
          "targets": [
            {
              "expr": "sum by (le) (rate(http_request_duration_seconds_bucket{service=\"api-gateway\"}[1m]))",
              "format": "heatmap",
              "legendFormat": "{{`{{le}}`}}"
            }
          ],
          "options": {
            "calculate": false,
            "yAxis": { "unit": "s" },
            "color": { "scheme": "Spectral", "mode": "scheme" },
            "cellGap": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "scaleDistribution": { "type": "linear" },
                "hideFrom": { "tooltip": false, "viz": false, "legend": false }
              }
            }
          }
        },
        {
          "title": "Transfer Flow: End-to-End vs Sub-Call P95 Latency",
          "type": "timeseries",
          "description": "Full transfer (api-gateway) latency vs per-service latency for the downstream account/transaction services. Gap between top line and sub-call lines = cumulative mTLS overhead across hops.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 52 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service=\"api-gateway\", path=~\".*transfer.*\"}[5m])))",
              "legendFormat": "end-to-end (api-gateway transfer)"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_server_requests_seconds_bucket{service=~\"account-service|transaction-service|audit-service\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{service=\"fraud-service\"}[5m])))",
              "legendFormat": "fraud-service"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_requests_duration_seconds_bucket{service=~\"exchange-service|notification-service\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 5, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Goroutines / JVM Live Threads by Pod",
          "type": "timeseries",
          "description": "Concurrency primitives in flight. Sustained rise under load can indicate handshake storms or connection-pool exhaustion under mTLS.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 60 },
          "targets": [
            {
              "expr": "go_goroutines{job!=\"prometheus\"}",
              "legendFormat": "{{`{{pod}}`}} (go)"
            },
            {
              "expr": "jvm_threads_live_threads",
              "legendFormat": "{{`{{pod}}`}} (jvm)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "drawStyle": "line", "fillOpacity": 5, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "GC Pause Time by Service",
          "type": "timeseries",
          "description": "Time spent in garbage collection per second. mTLS increases heap pressure (cert chains, session caches); GC spikes here often explain P99 degradation.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 60 },
          "targets": [
            {
              "expr": "sum by (service) (rate(go_gc_duration_seconds_sum[5m]))",
              "legendFormat": "{{`{{service}}`}} (go)"
            },
            {
              "expr": "sum by (service) (rate(jvm_gc_pause_seconds_sum[5m]))",
              "legendFormat": "{{`{{service}}`}} (jvm)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Open File Descriptors by Pod",
          "type": "timeseries",
          "description": "Each TLS connection holds an FD. Climbing FD count under mTLS is an early sign of connection churn (pool misses → full handshakes).",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 68 },
          "targets": [
            {
              "expr": "process_open_fds{job!=\"prometheus\"}",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "drawStyle": "line", "fillOpacity": 5, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Total Cluster Throughput",
          "type": "stat",
          "description": "Aggregate req/s across all services — one anchor number per load-test run. Compare mTLS on vs off across side-by-side browser tabs.",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 68 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job!=\"prometheus\"}[1m])) + sum(rate(http_server_requests_seconds_count{job!=\"prometheus\"}[1m])) + sum(rate(http_requests_duration_seconds_count{job!=\"prometheus\"}[1m]))",
              "legendFormat": "total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "steps": [
                  { "color": "blue", "value": null }
                ]
              },
              "displayName": "Total req/s"
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["microbank", "overview", "mtls"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "MicroBank Overview",
      "uid": "microbank-overview"
    }

  istio-mesh-latency.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "mTLS Coverage (mesh traffic)",
          "type": "stat",
          "description": "Share of inter-service requests reported as connection_security_policy=mutual_tls by the destination sidecar. Excludes kubelet probe traffic (source_workload=unknown). Should read ~100% once STRICT PeerAuthentication + ISTIO_MUTUAL DestinationRule are applied.",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "100 * sum(rate(istio_requests_total{reporter=\"destination\", source_workload!=\"unknown\", connection_security_policy=\"mutual_tls\"}[5m])) / sum(rate(istio_requests_total{reporter=\"destination\", source_workload!=\"unknown\"}[5m]))",
              "legendFormat": "mTLS %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 90 },
                  { "color": "green", "value": 99.9 }
                ]
              }
            }
          }
        },
        {
          "title": "Request Rate per Hop (source → destination)",
          "type": "timeseries",
          "description": "Service-to-service call rate as seen by each destination sidecar. One line per (source_workload, destination_workload) pair — a single transfer fans out into 6+ distinct hops (api-gateway→transaction-service, transaction-service→account/fraud/exchange/notification/audit-service).",
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "sum by (source_workload, destination_workload) (rate(istio_requests_total{reporter=\"destination\", source_workload!=\"unknown\"}[5m]))",
              "legendFormat": "{{`{{source_workload}}`}} → {{`{{destination_workload}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P50 Latency by Hop",
          "type": "timeseries",
          "description": "Envoy-observed latency per hop — measured by the destination sidecar, so it includes TLS/mTLS handshake and proxy processing time that app-level metrics (http_request_duration_seconds etc.) miss entirely.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (source_workload, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "legendFormat": "{{`{{source_workload}}`}} → {{`{{destination_workload}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P95 Latency by Hop",
          "type": "timeseries",
          "description": "Envoy-observed P95 latency per hop. This is the layer where mTLS overhead actually shows up first (new-handshake tail), before it's visible in app-level timers.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (source_workload, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "legendFormat": "{{`{{source_workload}}`}} → {{`{{destination_workload}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P99 Latency by Hop",
          "type": "timeseries",
          "description": "Envoy-observed P99 latency per hop.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (source_workload, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "legendFormat": "{{`{{source_workload}}`}} → {{`{{destination_workload}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "mTLS vs Plaintext Latency (all hops blended)",
          "type": "timeseries",
          "description": "P50/P95/P99 grouped by connection_security_policy instead of by hop. Only useful for comparison once some traffic is deliberately left in PERMISSIVE/plaintext (e.g. before applying k8s/istio/peer-authentication-strict.yaml, or for a baseline run) — under the current STRICT policy this should collapse to a single mutual_tls series.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (connection_security_policy, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "legendFormat": "p50 {{`{{connection_security_policy}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (connection_security_policy, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "legendFormat": "p95 {{`{{connection_security_policy}}`}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (connection_security_policy, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "legendFormat": "p99 {{`{{connection_security_policy}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Latency Distribution Heatmap — transaction-service inbound",
          "type": "heatmap",
          "description": "Full distribution of all inbound hops to transaction-service (api-gateway→transaction-service). A second high-latency band appearing under load indicates handshake-vs-reused-connection split — invisible on percentile lines.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "sum by (le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", destination_workload=\"microbank-transaction-service\", source_workload!=\"unknown\"}[1m]))",
              "format": "heatmap",
              "legendFormat": "{{`{{le}}`}}"
            }
          ],
          "options": {
            "calculate": false,
            "yAxis": { "unit": "ms" },
            "color": { "scheme": "Spectral", "mode": "scheme" },
            "cellGap": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "scaleDistribution": { "type": "linear" },
                "hideFrom": { "tooltip": false, "viz": false, "legend": false }
              }
            }
          }
        },
        {
          "title": "Per-Hop P50 / P95 / P99 Summary",
          "type": "table",
          "description": "Snapshot table, one row per hop, for quickly reading off numbers into a benchmark writeup.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (source_workload, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "format": "table",
              "instant": true,
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (source_workload, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "format": "table",
              "instant": true,
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (source_workload, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload!=\"unknown\"}[5m])))",
              "format": "table",
              "instant": true,
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms" }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["microbank", "istio", "mtls", "latency"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Istio Mesh Latency (mTLS overhead)",
      "uid": "istio-mesh-latency"
    }

  client-side-hop-latency.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "title": "How to use this dashboard for baseline vs mTLS comparison",
          "type": "text",
          "asDropdown": false
        }
      ],
      "panels": [
        {
          "title": "About: mesh-independent baseline comparison",
          "type": "text",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "client_request_duration_seconds is emitted by api-gateway (Go) and transaction-service (Kotlin) themselves, around every outbound call — it exists identically whether or not a service mesh is installed. Unlike the Istio dashboard, this one stays valid with `global.serviceMesh.provider=none`. To get a real overhead number: run a load test with no mesh installed, note the P95 per hop below (or export this dashboard), then apply Istio STRICT mTLS and re-run — the delta per hop is the actual mTLS/proxy cost, isolated from app processing time."
          }
        },
        {
          "title": "Request Rate per Hop (source → destination)",
          "type": "timeseries",
          "description": "Outbound call rate as measured by the calling app itself (api-gateway, transaction-service), not by a sidecar.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum by (service, destination) (rate(client_request_duration_seconds_count[5m]))",
              "legendFormat": "{{`{{service}}`}} → {{`{{destination}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P50 Latency by Hop",
          "type": "timeseries",
          "description": "App-measured latency per outbound call. With no mesh installed this is close to true wall-clock hop time; with Istio installed it will include whatever the local network stack + iptables redirect + sidecar add, since the app still waits for the full round trip through its own local proxy.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (service, destination, le) (rate(client_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{`{{service}}`}} → {{`{{destination}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P95 Latency by Hop",
          "type": "timeseries",
          "description": "Compare this panel's numbers across two dashboard exports (mesh provider=none vs provider=istio) to isolate the mTLS/proxy overhead per hop.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (service, destination, le) (rate(client_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{`{{service}}`}} → {{`{{destination}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "P99 Latency by Hop",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (service, destination, le) (rate(client_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{`{{service}}`}} → {{`{{destination}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Error Rate per Hop (non-2xx / transport errors)",
          "type": "timeseries",
          "description": "status=\"error\" means the outbound call never got an HTTP response at all (timeout, connection refused/reset) — worth watching separately when toggling STRICT mTLS, since a misconfigured DestinationRule shows up here first as connection resets, not as slow requests.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [
            {
              "expr": "sum by (service, destination, status) (rate(client_request_duration_seconds_count{status=\"error\"}[5m]) or rate(client_request_duration_seconds_count{status!~\"2..\"}[5m]))",
              "legendFormat": "{{`{{service}}`}} → {{`{{destination}}`}} ({{`{{status}}`}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 },
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "title": "Latency Distribution Heatmap — transaction-service → account-service",
          "type": "heatmap",
          "description": "Full distribution for the busiest hop in a transfer. Compare shape (not just percentiles) between a no-mesh run and an mTLS run — a connection-reuse vs fresh-handshake split shows up here as a second band.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "targets": [
            {
              "expr": "sum by (le) (rate(client_request_duration_seconds_bucket{service=\"transaction-service\"}[1m]))",
              "format": "heatmap",
              "legendFormat": "{{`{{le}}`}}"
            }
          ],
          "options": {
            "calculate": false,
            "yAxis": { "unit": "s" },
            "color": { "scheme": "Spectral", "mode": "scheme" },
            "cellGap": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "scaleDistribution": { "type": "linear" },
                "hideFrom": { "tooltip": false, "viz": false, "legend": false }
              }
            }
          }
        },
        {
          "title": "Per-Hop P50 / P95 / P99 Summary",
          "type": "table",
          "description": "Snapshot table for reading numbers straight into a benchmark writeup. Run once with no mesh, screenshot/export, then again with Istio STRICT mTLS — the row-by-row delta is the overhead.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 36 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (service, destination, le) (rate(client_request_duration_seconds_bucket[5m])))",
              "format": "table",
              "instant": true,
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, destination, le) (rate(client_request_duration_seconds_bucket[5m])))",
              "format": "table",
              "instant": true,
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (service, destination, le) (rate(client_request_duration_seconds_bucket[5m])))",
              "format": "table",
              "instant": true,
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["microbank", "baseline", "mtls", "latency"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Client-Side Hop Latency (mesh-independent)",
      "uid": "client-hop-latency"
    }

