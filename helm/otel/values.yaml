namespace: student-research

otelCollector:
  image: otel/opentelemetry-collector-contrib:0.100.0
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

honeycomb:
  apiKey: ""
  endpoint: "https://api.honeycomb.io"

serviceMesh:
  # Which mesh is active in the cluster. Used to emit the correct
  # sidecar-opt-out annotation on the OTel collector pod so it never
  # gets a sidecar (avoids telemetry feedback loops). One of: istio | linkerd | none.
  provider: istio

environment: development
